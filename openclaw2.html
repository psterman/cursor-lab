<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>OpenClaw 3D Nexus</title>

<style>
:root{--bg:#06080c;--bg2:#090d14;--red:#e63946;--green:#00ff41;--txt:#ecf4ff;--dim:#8fa5be;--line:rgba(255,255,255,.17);--card:rgba(8,13,22,.58);--top-header-height:52px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(230,57,70,.16),transparent 45%),radial-gradient(circle at 15% 80%,rgba(0,255,65,.08),transparent 45%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--txt);font-family:"JetBrains Mono","Inter",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(0,255,65,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.05) 1px,transparent 1px);background-size:26px 26px;z-index:0}
.hud{position:fixed;z-index:30;font-size:11px;letter-spacing:.06em;color:var(--dim);pointer-events:none}.hud strong{color:var(--green)}
.tl{top:calc(var(--top-header-height) + 12px);left:20px}.tr{top:calc(var(--top-header-height) + 12px);right:20px;text-align:right}.bl{bottom:86px;left:20px}.br{bottom:86px;right:20px;text-align:right}
.hero{position:fixed;top:calc(var(--top-header-height) + 12px);left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none}
.hero h1{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:800;text-transform:uppercase;text-shadow:0 0 24px rgba(230,57,70,.34)}
.hero .sub{margin-top:8px;color:var(--dim);letter-spacing:.22em;text-transform:uppercase}
.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;z-index:10}
.orbit{position:absolute;inset:0;pointer-events:none;z-index:12}
.anchor{position:relative;width:min(44vw,420px);aspect-ratio:1/1;display:grid;place-items:center;z-index:18;animation:float 6s ease-in-out infinite}
.reactor{width:100%;height:100%;display:grid;place-items:center;transition:transform .24s ease}
.ring{position:absolute;width:84%;height:84%;border-radius:50%;border:1px solid rgba(230,57,70,.5);box-shadow:inset 0 0 32px rgba(230,57,70,.14),0 0 24px rgba(230,57,70,.24);animation:ring 2.8s ease-in-out infinite}
.svg{width:100%;height:100%;filter:drop-shadow(0 0 26px rgba(230,57,70,.3));animation:pulse 2.8s ease-in-out infinite}
.card{position:absolute;top:50%;left:50%;width:min(30vw,286px);min-height:136px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 36px rgba(0,0,0,.42);transition:transform .68s cubic-bezier(.22,.8,.2,1),opacity .42s ease;pointer-events:auto;overflow:hidden}
.card:before,.card:after{content:"";position:absolute;width:20px;height:20px;border:1px solid rgba(230,57,70,.45);opacity:.65}.card:before{top:6px;left:6px;border-right:none;border-bottom:none}.card:after{right:6px;bottom:6px;border-left:none;border-top:none}
.card h3{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}.card .v{font-size:clamp(1rem,2.2vw,1.45rem);font-weight:700;margin-bottom:8px}.card .d{font-size:11px;color:var(--dim);line-height:1.45}
.nav{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(94vw,1080px)}
.btn,.view{border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:9px 14px;font-size:12px;color:#edf7ff;background:linear-gradient(135deg,rgba(230,57,70,.26),rgba(0,255,65,.14));cursor:pointer;font-family:"JetBrains Mono",monospace;letter-spacing:.08em;transition:.2s}.btn:hover,.view:hover{border-color:rgba(0,255,65,.7);transform:translateY(-1px)}.btn.on{border-color:rgba(0,255,65,.95);background:linear-gradient(135deg,rgba(230,57,70,.9),rgba(0,255,65,.9));color:#0a120e}
.view{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:55}
.boot{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(6,8,12,.94);transition:opacity .25s}.boot.hide{opacity:0;pointer-events:none}.boot .box{width:min(90vw,420px);border:1px solid var(--line);border-radius:12px;background:rgba(8,13,22,.7);padding:18px;text-align:center}.boot .t{color:var(--green);letter-spacing:.1em}.boot .s{margin-top:8px}.bar{margin-top:12px;height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden}.bar i{display:block;width:42%;height:100%;background:linear-gradient(90deg,var(--red),var(--green));animation:load 1.2s ease-in-out infinite}
.detail{position:fixed;inset:0;z-index:60;pointer-events:none}.detail.open{pointer-events:auto}.mask{position:absolute;inset:0;background:rgba(3,6,10,.58);opacity:0;transition:.25s}.detail.open .mask{opacity:1}
.panels{position:absolute;inset:0;display:flex;justify-content:space-between;padding:calc(var(--top-header-height) + 40px) 18px 120px;gap:16px}.panel{width:min(48vw,560px);background:rgba(8,13,22,.66);border:1px solid rgba(255,255,255,.22);border-radius:12px;backdrop-filter:blur(12px);padding:14px;overflow:auto;transition:transform .32s}.left{transform:translateX(-110%)}.right{transform:translateX(110%)}.detail.open .left,.detail.open .right{transform:translateX(0)}
.pt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:10px}.blk{border:1px solid rgba(255,255,255,.16);border-radius:10px;background:rgba(255,255,255,.02);padding:10px;margin-bottom:10px}
#radar{width:100%;max-width:380px;aspect-ratio:1/1;display:block;margin:0 auto}.wc{display:flex;flex-wrap:wrap;gap:8px;min-height:160px;align-items:center;justify-content:center}.wc span{padding:3px 6px;border:1px solid rgba(255,255,255,.2);border-radius:999px}
.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:120px 1fr;gap:8px;border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:8px;font-size:12px}.k{color:var(--green)}.v{word-break:break-word}
.close{position:absolute;right:16px;top:calc(var(--top-header-height) + 16px);z-index:61;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(12,20,30,.7);color:#fff;padding:7px 12px;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes pulse{0%,100%{filter:drop-shadow(0 0 24px rgba(230,57,70,.26))}50%{filter:drop-shadow(0 0 34px rgba(230,57,70,.48))}}@keyframes ring{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.022);opacity:1}}@keyframes load{0%{transform:translateX(-120%)}55%{transform:translateX(170%)}100%{transform:translateX(170%)}}
@media(max-width:900px){.card{width:min(46vw,220px)}.panels{flex-direction:column;padding:84px 12px 110px}.panel{width:100%}.left,.right{transform:translateY(110%)}.detail.open .left,.detail.open .right{transform:translateY(0)}}
@media(max-width:700px){.anchor{width:min(62vw,320px)}.card{width:min(68vw,220px)}.view{bottom:64px;font-size:11px}.nav{bottom:12px}.btn{font-size:11px;padding:8px 12px}}
/* top-header (ref: stats2) */
.top-header{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(6,8,12,.92);border-bottom:1px solid rgba(0,255,65,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-header-left{display:flex;align-items:center}
.top-header-title{display:flex;flex-direction:column;gap:2px}
.top-header-title h1{margin:0;font-size:18px;font-weight:700;color:var(--txt);letter-spacing:.04em}
.top-header-title .top-header-sub{font-size:9px;color:var(--dim);letter-spacing:.1em}
.top-header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top-header-card{display:flex;flex-direction:column;padding:6px 10px;border:1px solid rgba(0,255,65,.25);border-radius:6px;background:rgba(0,0,0,.35)}
.top-header-card-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.top-header-card-value,.top-header-nav-link{font-size:12px;color:var(--green);text-decoration:none;cursor:pointer;font-family:"JetBrains Mono",monospace}
.top-header-nav-link:hover{color:rgba(0,255,65,.9)}
.lang-switch{display:flex;gap:4px}
.lang-switch button{border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:4px 10px;font-size:11px;background:rgba(255,255,255,.06);color:var(--dim);cursor:pointer;font-family:"JetBrains Mono",monospace;transition:.2s}
.lang-switch button:hover{color:var(--txt);border-color:var(--green)}
.lang-switch button.active{background:rgba(0,255,65,.2);color:var(--green);border-color:var(--green)}
@media(max-width:700px){.top-header{flex-direction:column;align-items:flex-start;padding:8px 12px}.top-header-title h1{font-size:16px}.top-header-right{width:100%;justify-content:space-between}}
</style>
</head>

<script>
(()=>{
const $=id=>document.getElementById(id),orbit=$("orbit"),sub=$("sub"),nav=$("nav"),time=$("time"),ax=$("ax"),ay=$("ay"),cl=$("cl"),pl=$("pl"),pr=$("pr"),oc=$("oc"),reactor=$("reactor"),view=$("view"),detail=$("detail"),mask=$("mask"),closeBtn=$("close"),radar=$("radar"),wc=$("wc"),list=$("list"),boot=$("boot"),status=$("status");
const state={themes:[],payload:{},metrics:null,idx:0,anim:false,lastWheel:0,dir:1,open:false,lang:(localStorage.getItem("openclaw2_lang")||"zh").replace(/^en$/i,"en").replace(/^zh$/i,"zh")||"zh"};
const i18n={
  zh:{

};
const eyes={l:{x:195,y:225},r:{x:305,y:225}},eyeLimit=12;
const N=(v,f=0)=>typeof v==="number"&&Number.isFinite(v)?v:(typeof v==="string"&&Number.isFinite(Number(v))?Number(v):f);
const fmt=v=>Number.isFinite(N(v,NaN))?N(v).toLocaleString():"--";
const pct=(v,d=1,noData)=>Number.isFinite(N(v,NaN))?`${N(v).toFixed(d)}%`:(noData||i18n[state.lang].noData);
const money=(v,noData)=>Number.isFinite(N(v,NaN))&&N(v)>0?`$${N(v).toFixed(4)}`:(noData||i18n[state.lang].noData);

function getApiEndpoint(){const e=(window.__API_ENDPOINT__||window.API_ENDPOINT||"").trim();if(e)return e;const m=document.querySelector('meta[name="api-endpoint"]');return m&&m.content?m.content.trim():"https://cursor-clinical-analysis.psterman.workers.dev/";}
const base=u=>u?u.endsWith("/")?u:u+"/":"";
async function fetchJson(url,t=9000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),t);try{const r=await fetch(url,{method:"GET",mode:"cors",cache:"no-store",headers:{"Content-Type":"application/json"},signal:c.signal});if(!r.ok)return null;return await r.json();}catch{return null}finally{clearTimeout(tm)}}
function pickPayload(raw){if(!raw||typeof raw!=="object")return null;if(raw.openclawPortrait||raw.openclawSessionsSummary)return raw;for(const c of [raw.data,raw.payload,raw.result,raw.analysis,raw.latest]){if(c&&typeof c==="object"&&(c.openclawPortrait||c.openclawSessionsSummary))return c;}return null;}
function localPayload(){for(const [s,k] of [[sessionStorage,"openclaw_analysis_data"],[localStorage,"openclaw_analysis_data"],[localStorage,"last_analysis_data"]]){try{const r=s.getItem(k);if(!r)continue;const d=JSON.parse(r),p=pickPayload(d);if(p)return p;if(d&&(d.stats||d.statistics))return {legacyStats:d.stats||d.statistics||{},updatedAt:d.updatedAt||d.createdAt||""};}catch{}}return {};}
async function workerPayload(){const b=base(getApiEndpoint());for(const p of ["api/openclaw/latest","api/openclaw/latest_analysis","api/analysis/latest","api/latest_analysis","api/openclaw/portrait"]){const j=await fetchJson(b+p,7500),d=pickPayload(j);if(d)return d;}return null;}
function score(p){if(!p||typeof p!=="object")return 0;const po=p.openclawPortrait||{},se=p.openclawSessionsSummary||{};let s=0;if(Object.keys(po).length)s+=2;if(Object.keys(se).length)s+=2;if(N(po?.dimensions?.consumptionCost?.totalTokens,0)>0)s+=2;if(N(se?.token?.totalTokensSum,0)>0)s+=2;if(N(se?.sessionCount,0)>0)s++;if(Array.isArray(se?.skills)&&se.skills.length)s++;return s;}
function processStats(payload,L){
L=L||state.lang;

init().catch(()=>{const L=state.lang;sub.textContent=L==="zh"?"数据离线":"DATA OFFLINE";setStatus(i18n[L].statusFailed);state.metrics=processStats({},L);state.themes=themes(state.metrics,L);mountNav();renderTheme(state.idx);refreshDetails();setTimeout(hideBoot,320);applyLang(L);});
})();
</script>
